[package]
name = "taggy-adserver"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.9"
actix-multipart = "0.7"
actix-cors = "0.7"
actix-files = "0.6"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
rand = "0.8"
futures-util = "0.3"
mime = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1